[profile.default]
# A test past 30 s is reported; one past 2 min has hung and is killed.
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci]
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }

# T1 of the characterisation matrix (main-postmerge.yml's partitions): a
# circuit's whole grid takes minutes, so a test past a minute is reported
# and none is killed (the job's timeout is the bound).
[profile.t1]
fail-fast = false
slow-timeout = { period = "60s" }

# Miri (CI's `miri` shards): one interpreted process per test; a slow
# one is reported, one past 5 min has hung.
[profile.miri]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

# The X11 shell's window tests move the one pointer (XTEST): one at a
# time (ledger X).
[test-groups]
x-display = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary_id(stave-ui-x11::xvfb)'
test-group = 'x-display'

[[profile.ci.overrides]]
filter = 'binary_id(stave-ui-x11::xvfb)'
test-group = 'x-display'
