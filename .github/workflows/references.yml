# The references the circuit models are held to (DSP.md R2, R17):
# regenerate every committed ngspice waveform and characterisation table
# with a pinned ngspice, and every solved reference with pinned
# NumPy/SciPy, and fail if any differs from the committed file — a stale
# fixture can't pass. scripts/ngspice-simulate.py first checks ngspice on
# circuits with exact answers. Beside it, T1 of the characterisation
# matrix: every circuit's whole grid held to those tables.
#
# The fixtures are a function of the netlists, the scripts and the pinned
# versions only, so the job runs when those change (and when the circuit
# code or the harness that reads them does). It is path-filtered and so
# NOT a required check: a required check that never reports blocks every
# other pull request. The models themselves are held to the fixtures by
# the test jobs in ci.yml and platforms.yml, on every change.
#
# ngspice from apt, NumPy/SciPy wheels from a pip cache; the tables are
# most of the time (one ngspice run per plan run, in parallel). T1 builds
# stave-test (opt-level 1, a rust-cache) and runs in its own job.
name: references

on:
  push:
    branches: [main, "release/**"]
    paths:
      - crates/stave-test/spice/**
      - crates/stave-test/reference/**
      - crates/stave-test/src/reference.rs
      - crates/stave-test/tests/matches_*.rs
      - crates/stave-test/tests/characterise*.rs
      - crates/stave-test/tests/circuits/**
      - crates/stave-test/src/characterise/**
      - crates/stave-measure/src/suite/**
      - crates/stave-dsp/src/circuit/**
      - scripts/ngspice-simulate.py
      - scripts/ja-reference.py
      - scripts/reference-requirements.txt
      - .github/workflows/references.yml
  pull_request:
    paths:
      - crates/stave-test/spice/**
      - crates/stave-test/reference/**
      - crates/stave-test/src/reference.rs
      - crates/stave-test/tests/matches_*.rs
      - crates/stave-test/tests/characterise*.rs
      - crates/stave-test/tests/circuits/**
      - crates/stave-test/src/characterise/**
      - crates/stave-measure/src/suite/**
      - crates/stave-dsp/src/circuit/**
      - scripts/ngspice-simulate.py
      - scripts/ja-reference.py
      - scripts/reference-requirements.txt
      - .github/workflows/references.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # The pinned ngspice: Ubuntu 24.04's package, exactly this build (a new
  # one fails the install, so a version change is a decision). The
  # committed waveforms were written by ngspice 47 (Homebrew, macOS); 42
  # reproduces them within 5e-6 of peak, inside --check's 2e-5, and the
  # perturbation step below proves the check still catches a 1% change.
  NGSPICE_PACKAGE: "42+ds-3build1"
  NGSPICE_VERSION: "42"
  # The classic circuits' transient decks (DSP.md R24, R25, R27; with the
  # Phase 90 swept, minutes of ngspice on its own): their
  # tables take ngspice most of an hour and their T1 matrices tens of
  # minutes at the 8–32× grids their op-amps need, so jobs of their own
  # check them (the circuits' list in crates/stave-test/tests/circuits/).
  CLASSICS: "tube_screamer_ts808,big_muff_rams_head,proco_rat,marshall_jcm800_2203,moog_ladder_feedback,mxr_phase90,boss_ds1,klon_centaur,mxr_distortion_plus,mxr_phase90_sweep"

jobs:
  references:
    name: references (ngspice, SciPy)
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/reference-requirements.txt
      - run: pip install -r scripts/reference-requirements.txt
      - name: Install ngspice ${{ env.NGSPICE_PACKAGE }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends "ngspice=$NGSPICE_PACKAGE"
      - name: ngspice's waveforms and tables are current
        run: python3 scripts/ngspice-simulate.py --check --expect-version "$NGSPICE_VERSION" --exclude "$CLASSICS" --keep target/fresh-tables
      # A stale table's fresh simulation under the pinned ngspice: download
      # it to commit (DSP.md R16: fixtures regenerated under ngspice 42).
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-tables
          path: target/fresh-tables
          if-no-files-found: ignore
      # The tolerance absorbs print and platform noise, not a real change:
      # a netlist value 1% off (the coupling cap) must fail the check.
      - name: A 1% netlist change fails the check
        run: |
          sed -i 's/^C1 i o 22n$/C1 i o 22.22n/' crates/stave-test/spice/coupler.cir
          git diff --quiet crates/stave-test/spice/coupler.cir && { echo "::error::the perturbation changed nothing"; exit 1; }
          if python3 scripts/ngspice-simulate.py --check --only coupler; then
            echo "::error::a 1% netlist change passed the check: the tolerance is too loose"
            exit 1
          fi
          git checkout crates/stave-test/spice/coupler.cir
      - name: The solved references are current
        run: python3 scripts/ja-reference.py --check
      - name: A 1% parameter change fails the check
        run: |
          sed -i 's/^MS, A, ALPHA, K, C = 1.6e6,/MS, A, ALPHA, K, C = 1.616e6,/' scripts/ja-reference.py
          git diff --quiet scripts/ja-reference.py && { echo "::error::the perturbation changed nothing"; exit 1; }
          if python3 scripts/ja-reference.py --check; then
            echo "::error::a 1% parameter change passed the check: the tolerance is too loose"
            exit 1
          fi
          git checkout scripts/ja-reference.py

  characterise:
    # T1 (DSP.md R17): every circuit's whole matrix against the committed
    # tables — the grid of levels and frequencies, IMD, bursts —
    # oversampled and at 44.1, 48 and 96 kHz. The tables' freshness is
    # the job above's.
    name: characterise (T1)
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - run: "cargo test -p stave-test --locked --test characterise_t1 -- --ignored --skip classics::"

  references-classics:
    name: references (classics, ngspice)
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/reference-requirements.txt
      - run: pip install -r scripts/reference-requirements.txt
      - name: Install ngspice ${{ env.NGSPICE_PACKAGE }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends "ngspice=$NGSPICE_PACKAGE"
      - name: The classics' waveforms and tables are current
        run: python3 scripts/ngspice-simulate.py --check --expect-version "$NGSPICE_VERSION" --only "$CLASSICS" --keep target/fresh-tables
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-tables-classics
          path: target/fresh-tables
          if-no-files-found: ignore

  characterise-classics:
    # The classics' T1 (`classics::` in characterise_t1.rs).
    name: characterise classics (T1)
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - run: "cargo test -p stave-test --locked --test characterise_t1 -- --ignored classics::"
