# The references the circuit models are held to (DSP.md R2, R17):
# regenerate every committed ngspice waveform and characterisation table
# with a pinned ngspice, and every solved reference with pinned
# NumPy/SciPy, and fail if any differs from the committed file — a stale
# fixture can't pass. scripts/ngspice-simulate.py first checks ngspice on
# circuits with exact answers. T1 characterisation runs in main-postmerge.yml.
#
# The fixtures are a function of the netlists, the scripts and the pinned
# versions only, so the workflow runs when those change (and when the
# circuit code or the harness that reads them does). It is path-filtered
# and so NOT a required check: a required check that never reports
# blocks every other pull request. The models themselves are held to the
# fixtures by the test jobs in ci.yml and platforms.yml, on every change.
#
# Every job aims at five minutes. ngspice's share — about four hours of
# one core — is split by deck into NGSPICE_SHARDS jobs, balanced by each
# deck's measured ngspice time (crates/stave-test/spice/costs.tsv; refresh
# it from a full run's `ngspice-costs-*` artifacts:
# `cat */costs.tsv | sort > crates/stave-test/spice/costs.tsv`). On a pull
# request, `changes` picks the shards holding a changed deck (all of them
# when the script, its requirements, the costs, the DC sweeps or this file
# change). The shards keep
# stamps of the checks that passed (ngspice-simulate.py --stamps: keyed by the script,
# the ngspice and NumPy versions, the deck, its plan and its committed
# files) in the Actions cache, and a pull request skips a deck whose stamp
# is there — unchanged since a passing check. A push to main or a release
# branch, or a dispatch, checks every deck afresh and records the stamps.
#
# Every job runs on a self-hosted Linux runner for trusted
# events and on GitHub's ubuntu-24.04 for a fork's pull request (`changes`
# picks; see its `runner` output). The self-hosted runners carry the same
# pinned ngspice package and run the same scripts.
name: references

on:
  push:
    branches: [main, "release/**"]
    paths:
      - crates/stave-test/spice/**
      - crates/stave-test/reference/**
      - crates/stave-test/src/reference.rs
      - crates/stave-test/tests/matches_*.rs
      - crates/stave-test/tests/characterise*.rs
      - crates/stave-test/tests/circuits/**
      - crates/stave-test/src/characterise/**
      - crates/stave-measure/src/suite/**
      - crates/stave-dsp/src/circuit/**
      - scripts/ngspice-simulate.py
      - scripts/ja-reference.py
      - scripts/reference-requirements.txt
      - .github/workflows/references.yml
      - .github/actions/reference-tools/**
      - .config/nextest.toml
  pull_request:
    paths:
      - crates/stave-test/spice/**
      - crates/stave-test/reference/**
      - crates/stave-test/src/reference.rs
      - crates/stave-test/tests/matches_*.rs
      - crates/stave-test/tests/characterise*.rs
      - crates/stave-test/tests/circuits/**
      - crates/stave-test/src/characterise/**
      - crates/stave-measure/src/suite/**
      - crates/stave-dsp/src/circuit/**
      - scripts/ngspice-simulate.py
      - scripts/ja-reference.py
      - scripts/reference-requirements.txt
      - .github/workflows/references.yml
      - .github/actions/reference-tools/**
      - .config/nextest.toml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The pinned ngspice: Ubuntu 24.04's package, exactly this build (a new
  # one fails the install, so a version change is a decision). The
  # committed waveforms were written by ngspice 47 (Homebrew, macOS); 42
  # reproduces them within 5e-6 of peak, inside --check's 2e-5, and the
  # perturbation step below proves the check still catches a 1% change.
  NGSPICE_PACKAGE: "42+ds-3build1"
  NGSPICE_VERSION: "42"
  # How many jobs share the decks.
  NGSPICE_SHARDS: "16"

jobs:
  changes:
    name: what the change touches
    timeout-minutes: 5
    # Where this and every other job runs: a self-hosted Linux runner with
    # the pinned ngspice (the `linux-build` and `ngspice` capabilities) for
    # trusted events (a push, a dispatch, a pull request from a branch of
    # this repository), GitHub's ubuntu-24.04 for a fork's pull request.
    # Main's runs always qualify; other refs once the repository variable
    # SELF_HOSTED_ALL_REFS is `true` (ci.yml's `lint` says why).
    # A full run is ~25 jobs: on GitHub's runners it took most of the free
    # plan's 20 concurrent jobs, and every other workflow queued behind it.
    runs-on: >-
      ${{ (github.event_name != 'pull_request'
           || github.event.pull_request.head.repo.full_name == github.repository)
          && (github.ref == 'refs/heads/main' || vars.SELF_HOSTED_ALL_REFS == 'true')
          && fromJSON('["self-hosted","Linux","X64","linux-build","ngspice"]')
          || 'ubuntu-24.04' }}
    outputs:
      # The same choice, for the jobs below.
      runner: >-
        ${{ toJSON(runner.environment == 'self-hosted'
                   && fromJSON('["self-hosted","Linux","X64","linux-build","ngspice"]')
                   || 'ubuntu-24.04') }}
      shards: ${{ steps.pick.outputs.shards }}
      total: ${{ steps.pick.outputs.total }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 2 }   # a pull request's merge commit and its base
      - id: pick
        run: |
          groups="$(python3 scripts/ngspice-simulate.py --shard-of "$NGSPICE_SHARDS")"
          every="$(seq -s, 1 "$NGSPICE_SHARDS")"
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            shards="[$every]"
          else
            changed="$(git diff --name-only HEAD^1 HEAD)"
            echo "$changed"
            if grep -qxE 'scripts/ngspice-simulate\.py|scripts/reference-requirements\.txt|crates/stave-test/spice/costs\.tsv|crates/stave-test/spice/dc_sweeps\..*|\.github/workflows/references\.yml|\.github/actions/reference-tools/.*' <<<"$changed"; then
              shards="[$every]"
            else
              picked=""
              for f in $(grep '^crates/stave-test/spice/' <<<"$changed" || true); do
                stem="$(basename "$f")"
                stem="${stem%%.*}"
                k="$(awk -F'\t' -v s="$stem" '$1 == s { print $2 }' <<<"$groups")"
                [[ -n "$k" ]] && picked+="$k"$'\n'
              done
              shards="[$(sort -nu <<<"$picked" | sed '/^$/d' | paste -sd, -)]"
            fi
          fi
          echo "ngspice shards: $shards of $NGSPICE_SHARDS"
          { echo "shards=$shards"; echo "total=$NGSPICE_SHARDS"; } >> "$GITHUB_OUTPUT"

  ngspice:
    name: references (ngspice ${{ matrix.shard }}/${{ needs.changes.outputs.total }})
    needs: changes
    if: needs.changes.outputs.shards != '[]'
    timeout-minutes: 20
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/reference-tools
        with: { ngspice-package: "${{ env.NGSPICE_PACKAGE }}" }
      # Every deck's stamps, as the last run's `stamps` job saved them.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ngspice-stamps
          key: ngspice-stamps-${{ env.NGSPICE_PACKAGE }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ngspice-stamps-${{ env.NGSPICE_PACKAGE }}-
      - name: ngspice's waveforms and tables are current
        run: >-
          python3 scripts/ngspice-simulate.py --check --expect-version "$NGSPICE_VERSION"
          --shard "${{ matrix.shard }}/${{ needs.changes.outputs.total }}"
          --stamps target/ngspice-stamps
          ${{ github.event_name == 'pull_request' && '--skip-stamped' || '' }}
          --keep target/fresh-tables --costs-out target/ngspice-costs/costs.tsv
      # The restored stamps and this shard's new ones, for `stamps`.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ngspice-stamps-${{ matrix.shard }}
          path: target/ngspice-stamps
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 1
      # A stale table's fresh simulation under the pinned ngspice: download
      # it to commit (DSP.md R16: fixtures regenerated under ngspice 42).
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fresh-tables-${{ matrix.shard }}
          path: target/fresh-tables
          if-no-files-found: ignore
      # What each deck cost, to rebalance the shards (costs.tsv).
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ngspice-costs-${{ matrix.shard }}
          path: target/ngspice-costs
          if-no-files-found: ignore

  stamps:
    # The shards' stamps (each holds the last saved set plus its passes)
    # merged into one cache entry, so a deck's stamp outlives a rebalance
    # that moves it to another shard. Stamps are only of passing checks,
    # so a failed shard's still count.
    name: references (save ngspice stamps)
    needs: [changes, ngspice]
    if: ${{ !cancelled() && needs.changes.outputs.shards != '[]' }}
    timeout-minutes: 5
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ngspice-stamps-*
          path: target/ngspice-stamps
          merge-multiple: true
      - run: echo "$(find target/ngspice-stamps -type f 2>/dev/null | wc -l) stamps"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/ngspice-stamps
          key: ngspice-stamps-${{ env.NGSPICE_PACKAGE }}-${{ github.run_id }}-${{ github.run_attempt }}

  solved:
    # The check's teeth (a 1% netlist change must fail it) and the solved
    # references (scripts/ja-reference.py), on every run.
    name: references (perturbation, SciPy)
    needs: changes
    timeout-minutes: 5
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/reference-tools
        with: { ngspice-package: "${{ env.NGSPICE_PACKAGE }}" }
      # The tolerance absorbs print and platform noise, not a real change:
      # a netlist value 1% off (the coupling cap) must fail the check.
      - name: A 1% netlist change fails the check
        run: |
          python3 scripts/ngspice-simulate.py --check --expect-version "$NGSPICE_VERSION" --only coupler
          sed -i 's/^C1 i o 22n$/C1 i o 22.22n/' crates/stave-test/spice/coupler.cir
          git diff --quiet crates/stave-test/spice/coupler.cir && { echo "::error::the perturbation changed nothing"; exit 1; }
          if python3 scripts/ngspice-simulate.py --check --only coupler; then
            echo "::error::a 1% netlist change passed the check: the tolerance is too loose"
            exit 1
          fi
          git checkout crates/stave-test/spice/coupler.cir
      - name: The solved references are current
        run: python3 scripts/ja-reference.py --check
      - name: A 1% parameter change fails the check
        run: |
          sed -i 's/^MS, A, ALPHA, K, C = 1.6e6,/MS, A, ALPHA, K, C = 1.616e6,/' scripts/ja-reference.py
          git diff --quiet scripts/ja-reference.py && { echo "::error::the perturbation changed nothing"; exit 1; }
          if python3 scripts/ja-reference.py --check; then
            echo "::error::a 1% parameter change passed the check: the tolerance is too loose"
            exit 1
          fi
          git checkout scripts/ja-reference.py
