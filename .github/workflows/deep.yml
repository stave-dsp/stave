# The deep checks: everything too slow for the main signal (ci.yml),
# nightly and on demand. Each job still aims at five minutes; a red one
# here is a finding, never a red push.
#
#   sanitizers   AddressSanitizer and ThreadSanitizer (C4)
#   sim-sweep    the simulated host over thousands of seeds (V3)
#   advisories   the RustSec database (C9)
#   semver       release branches against the release they patch (C9)
name: deep

on:
  schedule:
    - cron: "17 3 * * *"   # nightly
  push:
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NIGHTLY: nightly-2026-11-01

jobs:
  sanitizers:
    # macOS: stave-host hosts bundles through CoreFoundation.
    name: sanitizer (${{ matrix.sanitizer }})
    timeout-minutes: 20
    if: github.event_name != 'push'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { key: "${{ matrix.sanitizer }}", cache-bin: "${{ runner.environment == 'github-hosted' }}" }
      - run: scripts/sanitize.sh ${{ matrix.sanitizer }}

  sim-sweep:
    # The simulated host over thousands of seeds (the main run does 48).
    name: simulated host (wide sweep)
    timeout-minutes: 20
    if: github.event_name != 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { cache-bin: "${{ runner.environment == 'github-hosted' }}" }
      - run: cargo test -p stave-host --release --locked --test sim_host
        env:
          STAVE_SIM_SEEDS: "3000"

  advisories:
    # The RustSec database changes without our commits.
    name: advisories (RustSec)
    timeout-minutes: 20
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with: { tool: cargo-deny@0.20.2 }
      - run: scripts/hygiene.sh advisories

  semver:
    # A release branch's patch must not break the API of the release it
    # patches (scripts/semver-checks.sh; scripts/release.sh runs it too).
    name: semver-checks (release branches)
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }   # the baseline tag
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { cache-bin: "${{ runner.environment == 'github-hosted' }}" }
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with: { tool: cargo-semver-checks@0.51.0 }
      - run: scripts/semver-checks.sh
