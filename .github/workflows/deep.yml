# The deep checks: everything too slow for the main signal (ci.yml),
# nightly and on demand. Each job still aims at five minutes; a red one
# here is a finding, never a red push.
#
#   kani         the proof harnesses (V2), one job per crate
#   sanitizers   AddressSanitizer and ThreadSanitizer (C4)
#   fuzz         every cargo-fuzz target, 4 min each (C5)
#   sim-sweep    the simulated host over thousands of seeds (V3)
#   advisories   the RustSec database (C9)
#   semver       release branches against the release they patch (C9)
name: deep

on:
  schedule:
    - cron: "17 3 * * *"   # nightly
  push:
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NIGHTLY: nightly-2026-11-01

jobs:
  kani:
    # One job per harness: each one's time is visible, and one that blows
    # its bounds cannot hold the rest (30 min cap).
    name: kani (${{ matrix.harness }})
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crate: stave-core, harness: ranges_alias_is_interval_overlap }
          - { crate: stave-core, harness: param_changes_sort_stably_by_frame }
          - { crate: stave-core, harness: split_for_block_hands_the_plugin_sound_buffers }
          - { crate: stave-core, harness: lanes_stay_inside_the_block }
          - { crate: stave-core, harness: an_unprepared_state_never_splits }
          - { crate: stave-core, harness: lookup_finds_the_first_declaration_of_every_id }
          - { crate: stave-core, harness: normalize_lands_in_the_unit_interval }
          - { crate: stave-core, harness: denormalize_lands_in_the_range }
          - { crate: stave-core, harness: delivers_in_order_across_the_counter_wrap }
          - { crate: stave-core, harness: a_full_ring_refuses_a_new_gesture_and_counts_it }
          - { crate: stave-core, harness: an_admitted_begin_always_gets_its_end }
          - { crate: stave-telemetry, harness: truncation_is_the_longest_fitting_prefix_and_round_trips }
          - { crate: stave-dsp, harness: delays_by_exactly_its_length }
          - { crate: stave-dsp, harness: bit_reversal_is_an_in_range_involution }
    steps:
      - uses: actions/checkout@v4
      - name: Cache Kani
        id: kani-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/kani
            ~/.cargo/bin/cargo-kani
            ~/.kani
          key: kani-0.68.0-${{ runner.os }}
      - if: steps.kani-cache.outputs.cache-hit != 'true'
        run: cargo install --locked kani-verifier@0.68.0 && cargo kani setup
      - run: scripts/kani.sh -p ${{ matrix.crate }} --harness ${{ matrix.harness }}

  sanitizers:
    # macOS: stave-host hosts bundles through CoreFoundation.
    name: sanitizer (${{ matrix.sanitizer }})
    timeout-minutes: 20
    if: github.event_name != 'push'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install $NIGHTLY --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.sanitizer }}" }
      - run: scripts/sanitize.sh ${{ matrix.sanitizer }}

  fuzz:
    # macOS: the vst3_host target hosts Tilt through stave-host.
    name: fuzz (${{ matrix.target }})
    timeout-minutes: 20
    if: github.event_name != 'push'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [state_load, param_text, vst3_host, clap_events, raster]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install $NIGHTLY --profile minimal
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: fuzz, key: "${{ matrix.target }}" }
      - uses: taiki-e/install-action@v2.90.3
        with: { tool: cargo-fuzz@0.13.2 }
      - run: scripts/fuzz.sh 240 ${{ matrix.target }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}

  sim-sweep:
    # The simulated host over thousands of seeds (the main run does 48).
    name: simulated host (wide sweep)
    timeout-minutes: 20
    if: github.event_name != 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p stave-host --release --locked --test sim_host
        env:
          STAVE_SIM_SEEDS: "3000"

  advisories:
    # The RustSec database changes without our commits.
    name: advisories (RustSec)
    timeout-minutes: 20
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2.90.3
        with: { tool: cargo-deny@0.20.2 }
      - run: scripts/hygiene.sh advisories

  semver:
    # A release branch's patch must not break the API of the release it
    # patches (scripts/semver-checks.sh; scripts/release.sh runs it too).
    name: semver-checks (release branches)
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the baseline tag
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2.90.3
        with: { tool: cargo-semver-checks@0.51.0 }
      - run: scripts/semver-checks.sh
