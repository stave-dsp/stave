# CI: the main signal (OVERHAUL.md C10). Aim for five minutes warm;
# ci-observe.yml measures execution and queue time rather than assuming it.
# Runs on pushes, pull requests and merge groups (main's merge queue).
#
# A pull request or a merge group gates what it changes, and only that:
# each job asks scripts/affected.sh which packages the change against its
# base reaches (the owners of the changed files and their dependents; a
# shared file — Cargo.lock, scripts/, .github/ — reaches everything) and
# runs its gates over those. A job the change cannot reach still reports
# success, so every required check reports on every change. Main,
# release branches and a dispatched run gate everything. Builds are --locked against the committed
# Cargo.lock; every tool is pinned. macOS runners only where macOS is
# needed (Cocoa, bundles, the validators, auval): three test shards plus
# lint and two validator jobs. Two macOS jobs run on a self-hosted runner
# for trusted events (a push, a merge
# group, a pull request from a branch here) and on GitHub's for a fork's
# pull request; GitHub's free plan runs only five macOS jobs at once.
#
# Miri, T1, fuzz and Kani run in main-postmerge.yml on main and nightly.
# Other deep tools remain in deep.yml. The newest-stable canary is
# canary.yml (weekly); Linux and Windows are platforms.yml; the
# documentation site, and with it the published rustdoc, is docs.yml.
name: ci

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A main run always finishes; newer pushes queue behind it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # scripts/affected.sh's base: the pull request's, or the merge group's.
  AFFECTED_ARGS: >-
    ${{ github.event_name == 'pull_request' && format('--base origin/{0}', github.base_ref)
    || github.event_name == 'merge_group' && format('--base {0}', github.event.merge_group.base_sha)
    || '--full' }}

jobs:
  test-shards:
    # Every test of the workspace (nextest builds what it runs) and the
    # doctests, on macOS (the Cocoa platform, bundles, stave-host).
    name: test (macOS ${{ matrix.shard }}/3)
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }   # the base, for scripts/affected.sh
      - run: rustup toolchain install   # the pinned toolchain from rust-toolchain.toml
      - name: What the change affects
        run: |
          # shellcheck disable=SC2086 # affected.sh emits separate cargo flags
          scripts/affected.sh --outputs $AFFECTED_ARGS >> "$GITHUB_ENV"
      - if: env.AFFECTED_SCOPE != 'none'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}", cache-bin: "${{ runner.environment == 'github-hosted' }}" }
      - if: env.AFFECTED_SCOPE != 'none'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with: { tool: nextest@0.9.148 }
      - if: env.AFFECTED_SCOPE != 'none'
        run: |
          # shellcheck disable=SC2086 # affected.sh emits separate cargo flags
          cargo nextest run --locked --profile ci --no-tests=pass --partition hash:${{ matrix.shard }}/3 $AFFECTED_PACKAGES
      - if: matrix.shard == 1 && env.AFFECTED_LIB_PACKAGES != ''
        run: |
          # shellcheck disable=SC2086 # affected.sh emits separate cargo flags
          cargo test --doc --locked $AFFECTED_LIB_PACKAGES
      # A golden-image mismatch leaves <name>.actual.png and .diff.png.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-diff-${{ matrix.shard }}
          path: target/golden-diff
          if-no-files-found: ignore
      # A reference case over its budget leaves target/reference-diff/<case>.tsv.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference-diff-${{ matrix.shard }}
          path: target/reference-diff
          if-no-files-found: ignore

  lint:
    # clippy (its -D warnings covers rustc's warnings), rustdoc with
    # every warning an error, and the MSRV check — one macOS job, one
    # cache.
    name: clippy + rustdoc + MSRV (macOS)
    timeout-minutes: 10
    # A self-hosted macOS runner (the `macos-build` capability) for trusted
    # events — a push, a merge group, a pull request from a branch of this
    # repository; a fork's pull request always gets GitHub's runner. Main's
    # runs always qualify; other refs (pull requests, merge groups, other
    # branches) once the repository variable SELF_HOSTED_ALL_REFS is
    # `true`, which says the runners' group admits those refs' workflows.
    runs-on: >-
      ${{ (github.event_name != 'pull_request'
           || github.event.pull_request.head.repo.full_name == github.repository)
          && (github.ref == 'refs/heads/main' || vars.SELF_HOSTED_ALL_REFS == 'true')
          && fromJSON('["self-hosted","macOS","ARM64","macos-build"]')
          || 'macos-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }   # the base, for scripts/affected.sh
      - run: rustup toolchain install
      - name: What the change affects
        run: |
          # shellcheck disable=SC2086 # affected.sh emits separate cargo flags
          scripts/affected.sh --outputs $AFFECTED_ARGS >> "$GITHUB_ENV"
      - if: env.AFFECTED_SCOPE != 'none'
        run: rustup toolchain install 1.86.0 --profile minimal
      - if: env.AFFECTED_SCOPE != 'none'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}", cache-bin: "${{ runner.environment == 'github-hosted' }}" }
      # Policy lives in [workspace.lints] (Cargo.toml); every crate inherits it.
      - if: env.AFFECTED_SCOPE != 'none'
        run: |
          # shellcheck disable=SC2086 # affected.sh emits separate cargo flags
          cargo clippy --all-targets --no-deps --locked $AFFECTED_PACKAGES -- -D warnings
      # Every intra-doc link, private items' docs included, and none
      # dropped between crates documented side by side: the same script
      # docs.yml's site build runs.
      - if: env.AFFECTED_SCOPE != 'none'
        run: |
          # shellcheck disable=SC2086 # affected.sh emits separate cargo flags
          scripts/rustdoc.sh --document-private-items $AFFECTED_DOC_PACKAGES
      # The declared rust-version is a promise: hold it.
      - if: env.AFFECTED_SCOPE != 'none'
        run: |
          # shellcheck disable=SC2086 # affected.sh emits separate cargo flags
          cargo +1.86.0 check --all-targets --locked $AFFECTED_PACKAGES

  validators:
    # The industry's own suites against every plugin: clap-validator and
    # Steinberg's VST3 validator (the SDK is MIT; its build is cached).
    name: validators (clap-validator, VST3)
    timeout-minutes: 10
    # Self-hosted for trusted events, as `lint` above.
    runs-on: >-
      ${{ (github.event_name != 'pull_request'
           || github.event.pull_request.head.repo.full_name == github.repository)
          && (github.ref == 'refs/heads/main' || vars.SELF_HOSTED_ALL_REFS == 'true')
          && fromJSON('["self-hosted","macOS","ARM64","macos-build"]')
          || 'macos-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }   # the base, for scripts/affected.sh
      - run: rustup toolchain install
      - name: What the change affects
        run: |
          # shellcheck disable=SC2086 # affected.sh emits separate cargo flags
          scripts/affected.sh --outputs $AFFECTED_ARGS >> "$GITHUB_ENV"
      - if: env.AFFECTED_SCOPE != 'none'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}", cache-bin: "${{ runner.environment == 'github-hosted' }}" }
      - name: Cache the validators
        if: env.AFFECTED_SCOPE != 'none'
        id: tools-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            vst3sdk/build/bin/Release/validator
            ~/.cargo/bin/clap-validator
          key: validators-${{ runner.os }}-vst3sdk-v3.8.1_build_84-clap-validator-0.4.1
      - name: Build the validators
        if: env.AFFECTED_SCOPE != 'none' && steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --locked --git https://github.com/free-audio/clap-validator.git --tag 0.4.1 clap-validator
          git clone --depth 1 --branch v3.8.1_build_84 --recurse-submodules --shallow-submodules \
            https://github.com/steinbergmedia/vst3sdk.git vst3sdk
          cmake -S vst3sdk -B vst3sdk/build -DCMAKE_BUILD_TYPE=Release \
            -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF \
            -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF \
            -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF
          cmake --build vst3sdk/build --target validator -j3
      - if: env.AFFECTED_SCOPE != 'none'
        run: scripts/validate-formats.sh clap
      - if: env.AFFECTED_SCOPE != 'none'
        run: scripts/validate-formats.sh vst3
        env:
          VALIDATOR: vst3sdk/build/bin/Release/validator

  audio-units:
    # Apple's auval against every plugin's Audio Unit, installed into
    # ~/Library/Audio/Plug-Ins/Components on the runner (auval finds only
    # registered components), and stave-host's validation suite on each
    # .component bundle, opened as itself. The full auval reports are
    # uploaded either way.
    name: validators (auval)
    timeout-minutes: 10
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }   # the base, for scripts/affected.sh
      - run: rustup toolchain install
      - name: What the change affects
        run: |
          # shellcheck disable=SC2086
          scripts/affected.sh --outputs $AFFECTED_ARGS >> "$GITHUB_ENV"
      - if: env.AFFECTED_SCOPE != 'none'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}", cache-bin: "${{ runner.environment == 'github-hosted' }}" }
      - if: env.AFFECTED_SCOPE != 'none'
        run: scripts/validate-formats.sh au
      - name: The validation suite on each .component
        if: env.AFFECTED_SCOPE != 'none'
        run: |
          cargo build --release --locked -p stave-bench
          for b in target/validate/*.component; do
            echo "== $b"
            target/release/stave-bench "$b" --validate > /dev/null
          done
      - if: always() && env.AFFECTED_SCOPE != 'none'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auval
          path: target/validate/*.auval.txt
          if-no-files-found: ignore

  rules:
    # The tree rules and hygiene: file sizes, view bindings, plugin
    # rules, the glossary, purity, golden-image sizes, the offload reaper;
    # licences, duplicate versions and sources (deny.toml); unused
    # dependencies.
    name: tree rules + hygiene
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with: { tool: "cargo-deny@0.20.2,cargo-machete@0.9.2" }
      - run: scripts/check-file-sizes.sh
      - run: scripts/check-view-bindings.sh
      - run: scripts/check-plugin-rules.sh
      - run: scripts/check-vocabulary.sh
      - run: scripts/check-purity.sh
      - run: scripts/check-golden-sizes.sh
      # The Kani matrix (main-postmerge.yml) is found by this parser: a
      # harness it cannot read fails here, on the change that wrote it.
      - run: scripts/kani.sh --list
      - run: python3 -m unittest discover -s scripts/tests -v
      # This machine's values (host names, library paths) never land: the
      # check reads them from the repository's secrets, the same keys as
      # stave.env.example; unset, it checks the generic shapes only.
      - name: local configuration leaks
        run: |
          scripts/check-local-leaks.sh
          # Generic worktree globs are portable; concrete agent IDs are local paths.
          if git grep -nE '/Users/[A-Za-z]|/home/[a-z][a-z0-9_-]*/|[.]claude/worktrees/agent-[[:xdigit:]]+'; then
            echo "a machine path is written into the repo (use the config keys, stave.env.example)" >&2
            exit 1
          fi
        env:
          STAVE_LINUX_HOST: ${{ secrets.STAVE_LINUX_HOST }}
          STAVE_MACOS_HOST: ${{ secrets.STAVE_MACOS_HOST }}
          STAVE_REFERENCE_HOST: ${{ secrets.STAVE_REFERENCE_HOST }}
          STAVE_AUTO_HOSTS: ${{ secrets.STAVE_AUTO_HOSTS }}
          STAVE_TAR_HOSTS: ${{ secrets.STAVE_TAR_HOSTS }}
          STAVE_SAMPLE_LIBRARY: ${{ secrets.STAVE_SAMPLE_LIBRARY }}
          STAVE_CORPUS_LOCK: ${{ secrets.STAVE_CORPUS_LOCK }}
          STAVE_CAPTURES: ${{ secrets.STAVE_CAPTURES }}
          # The signing identities release.yml signs with (their names and
          # team IDs), and a local notary profile's name.
          STAVE_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          STAVE_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          STAVE_NOTARY_PROFILE: ${{ secrets.STAVE_NOTARY_PROFILE }}
      - run: scripts/check-offload-reap.sh
      - run: scripts/hygiene.sh deps

  plugins:
    # Every change, before it merges: do the plugins in stave-dsp/stave-plugins
    # still build and lint against it? Not a required check — main may
    # break the plugin API (they pin a release tag) — but a red mark here
    # says the next bump-framework.sh needs plugin work. During a planned
    # break the job builds the stave-plugins branch that follows it, when
    # there is one (scripts/plugins-ref.sh: a `plugins-branch:` line in
    # the pull request or commit, a branch of the same name, or
    # `stave-<next release>`), else stave-plugins' main.
    name: plugins against this change (Linux)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { path: stave, fetch-depth: 0 }
      - run: rustup toolchain install
        working-directory: stave
      - name: What the change affects
        run: |
          # shellcheck disable=SC2086 # affected.sh emits separate cargo flags
          scripts/affected.sh --outputs $AFFECTED_ARGS >> "$GITHUB_ENV"
        working-directory: stave
      # The pull request: this run's, the merge group's (its ref names
      # it), or a push's squashed commit's "(#N)".
      - name: Which stave-plugins branch
        if: env.AFFECTED_SCOPE != 'none'
        working-directory: stave
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message || github.event.merge_group.head_commit.message }}
        run: |
          pr="$PR"
          [[ -z "$pr" && "$GITHUB_REF" =~ /pr-([0-9]+)- ]] && pr="${BASH_REMATCH[1]}"
          [[ -z "$pr" && "$HEAD_MESSAGE" =~ \(#([0-9]+)\) ]] && pr="${BASH_REMATCH[1]}"
          text="$RUNNER_TEMP/change.txt" branch=""
          printf '%s\n' "$HEAD_MESSAGE" > "$text"
          if [[ -n "$pr" ]]; then
            gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json body -q .body >> "$text"
            branch="$(gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json headRefName -q .headRefName)"
          fi
          scripts/plugins-ref.sh --text "$text" --branch "$branch" | tee -a "$GITHUB_ENV"
      - if: env.AFFECTED_SCOPE != 'none'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { repository: stave-dsp/stave-plugins, path: stave-plugins, ref: "${{ env.PLUGINS_REF }}" }
      - if: env.AFFECTED_SCOPE != 'none'
        run: rustup toolchain install
        working-directory: stave-plugins
      - if: env.AFFECTED_SCOPE != 'none'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Never on persistent self-hosted runners: its cleanBin deletes the
          # tools that were in ~/.cargo/bin before the job (rustup, nextest…).
          cache-bin: "${{ runner.environment == 'github-hosted' }}"
          workspaces: stave-plugins
          save-if: "${{ github.ref == 'refs/heads/main' }}"
      - if: env.AFFECTED_SCOPE != 'none'
        run: scripts/link-framework.sh ../stave
        working-directory: stave-plugins
      - if: env.AFFECTED_SCOPE != 'none'
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: stave-plugins

  portable:
    # The portable crates never grow platform assumptions: check them on
    # x86_64 Linux, and run their loom models here too.
    name: portable check + loom (Linux)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }   # the base, for scripts/affected.sh
      - run: rustup toolchain install
      - name: What the change affects
        run: |
          # shellcheck disable=SC2086 # affected.sh emits separate cargo flags
          scripts/affected.sh --outputs $AFFECTED_ARGS >> "$GITHUB_ENV"
      - if: env.AFFECTED_SCOPE != 'none'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}", cache-bin: "${{ runner.environment == 'github-hosted' }}" }
      - if: env.AFFECTED_SCOPE != 'none'
        run: >-
          cargo check --all-targets --locked
          -p stave-core -p stave-dsp -p stave-telemetry -p stave-measure -p stave-macros
          -p stave-ui -p stave-raster -p stave-face -p stave-clap -p stave-clap-sys
          -p stave-vst3 -p stave-vst3-sys -p stave-au -p stave-au-sys -p stave-model
      - if: env.AFFECTED_SCOPE != 'none'
        run: cargo test -p stave-core -p stave-telemetry --test loom --release --locked
        env:
          RUSTFLAGS: --cfg loom

  test:
    name: test (macOS)
    needs: test-shards
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.test-shards.result }}

  gate:
    name: queue gate
    needs: [test, lint, validators, audio-units, rules, portable]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: python3 -c 'import json,os; assert all(j["result"] == "success" for j in json.loads(os.environ["NEEDS"]).values())'
        env:
          NEEDS: ${{ toJSON(needs) }}

  # Migration bridges for the old ruleset; no Miri executes before merge.
  # Remove after the documented required-check migration has been applied.
  miri:
    name: miri (${{ matrix.shard }}/4)
    needs: gate
    if: always()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.gate.result }}
