# CI: the main signal (OVERHAUL.md C10). Every job here fits in
# five minutes warm and the run's wall clock does too, so it gates every
# push, pull request and merge group (main's merge queue).
#
# A pull request or a merge group gates what it changes, and only that:
# each job asks scripts/affected.sh which packages the change against its
# base reaches (the owners of the changed files and their dependents; a
# shared file — Cargo.lock, scripts/, .github/ — reaches everything) and
# runs its gates over those. A job the change cannot reach still reports
# success, so every required check reports on every change. Main,
# release branches and a dispatched run gate everything. Builds are --locked against the committed
# Cargo.lock; every tool is pinned. macOS runners only where macOS is
# needed (Cocoa, bundles, the validators) — three jobs, so they never
# queue behind each other; everything else is Linux.
#
# The slow tools (Kani, sanitizers, long fuzzing, the simulated host's
# wide sweep, advisories, semver-checks) are in deep.yml: nightly and on
# demand, never in this run's way. The newest-stable canary is
# canary.yml (weekly); Linux and Windows are platforms.yml; the
# documentation site, and with it the published rustdoc, is docs.yml.
name: ci

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A main run always finishes; newer pushes queue behind it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The one nightly (Miri here; sanitizers and fuzzing in deep.yml).
  NIGHTLY: nightly-2026-11-01
  # scripts/affected.sh's base: the pull request's, or the merge group's.
  AFFECTED_ARGS: >-
    ${{ github.event_name == 'pull_request' && format('--base origin/{0}', github.base_ref)
    || github.event_name == 'merge_group' && format('--base {0}', github.event.merge_group.base_sha)
    || '--full' }}

jobs:
  test:
    # Every test of the workspace (nextest builds what it runs) and the
    # doctests, on macOS (the Cocoa platform, bundles, stave-host).
    name: test (macOS)
    timeout-minutes: 10
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the base, for scripts/affected.sh
      - run: rustup toolchain install   # the pinned toolchain from rust-toolchain.toml
      - name: What the change affects
        run: scripts/affected.sh --outputs $AFFECTED_ARGS >> "$GITHUB_ENV"
      - if: env.AFFECTED_SCOPE != 'none'
        uses: Swatinem/rust-cache@v2
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - if: env.AFFECTED_SCOPE != 'none'
        uses: taiki-e/install-action@v2.90.3
        with: { tool: nextest@0.9.148 }
      - if: env.AFFECTED_SCOPE != 'none'
        run: cargo nextest run --locked --profile ci --no-tests=pass $AFFECTED_PACKAGES
      - if: env.AFFECTED_LIB_PACKAGES != ''
        run: cargo test --doc --locked $AFFECTED_LIB_PACKAGES
      # A golden-image mismatch leaves <name>.actual.png and .diff.png.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diff
          path: target/golden-diff
          if-no-files-found: ignore
      # A reference case over its budget leaves target/reference-diff/<case>.tsv.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reference-diff
          path: target/reference-diff
          if-no-files-found: ignore

  lint:
    # clippy (its -D warnings covers rustc's warnings), rustdoc with
    # every warning an error, and the MSRV check — one macOS job, one
    # cache.
    name: clippy + rustdoc + MSRV (macOS)
    timeout-minutes: 10
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the base, for scripts/affected.sh
      - run: rustup toolchain install
      - name: What the change affects
        run: scripts/affected.sh --outputs $AFFECTED_ARGS >> "$GITHUB_ENV"
      - if: env.AFFECTED_SCOPE != 'none'
        run: rustup toolchain install 1.86.0 --profile minimal
      - if: env.AFFECTED_SCOPE != 'none'
        uses: Swatinem/rust-cache@v2
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      # Policy lives in [workspace.lints] (Cargo.toml); every crate inherits it.
      - if: env.AFFECTED_SCOPE != 'none'
        run: cargo clippy --all-targets --no-deps --locked $AFFECTED_PACKAGES -- -D warnings
      # Every intra-doc link, private items' docs included, and none
      # dropped between crates documented side by side: the same script
      # docs.yml's site build runs.
      - if: env.AFFECTED_SCOPE != 'none'
        run: scripts/rustdoc.sh --document-private-items $AFFECTED_DOC_PACKAGES
      # The declared rust-version is a promise: hold it.
      - if: env.AFFECTED_SCOPE != 'none'
        run: cargo +1.86.0 check --all-targets --locked $AFFECTED_PACKAGES

  validators:
    # The industry's own suites against every plugin: clap-validator and
    # Steinberg's VST3 validator (the SDK is MIT; its build is cached).
    name: validators (clap-validator, VST3)
    timeout-minutes: 10
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the base, for scripts/affected.sh
      - run: rustup toolchain install
      - name: What the change affects
        run: scripts/affected.sh --outputs $AFFECTED_ARGS >> "$GITHUB_ENV"
      - if: env.AFFECTED_SCOPE != 'none'
        uses: Swatinem/rust-cache@v2
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - name: Cache the validators
        if: env.AFFECTED_SCOPE != 'none'
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: |
            vst3sdk/build/bin/Release/validator
            ~/.cargo/bin/clap-validator
          key: validators-${{ runner.os }}-vst3sdk-v3.8.1_build_84-clap-validator-0.4.1
      - name: Build the validators
        if: env.AFFECTED_SCOPE != 'none' && steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --locked --git https://github.com/free-audio/clap-validator.git --tag 0.4.1 clap-validator
          git clone --depth 1 --branch v3.8.1_build_84 --recurse-submodules --shallow-submodules \
            https://github.com/steinbergmedia/vst3sdk.git vst3sdk
          cmake -S vst3sdk -B vst3sdk/build -DCMAKE_BUILD_TYPE=Release \
            -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF \
            -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF \
            -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF
          cmake --build vst3sdk/build --target validator -j3
      - if: env.AFFECTED_SCOPE != 'none'
        run: scripts/validate-formats.sh clap
      - if: env.AFFECTED_SCOPE != 'none'
        run: scripts/validate-formats.sh vst3
        env:
          VALIDATOR: vst3sdk/build/bin/Release/validator

  rules:
    # The tree rules and hygiene: file sizes, view bindings, plugin
    # rules, the glossary, purity, golden-image sizes; licences,
    # duplicate versions and sources (deny.toml); unused dependencies.
    name: tree rules + hygiene
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2.90.3
        with: { tool: "cargo-deny@0.20.2,cargo-machete@0.9.2" }
      - run: scripts/check-file-sizes.sh
      - run: scripts/check-view-bindings.sh
      - run: scripts/check-plugin-rules.sh
      - run: scripts/check-vocabulary.sh
      - run: scripts/check-purity.sh
      - run: scripts/check-golden-sizes.sh
      - run: scripts/hygiene.sh deps

  plugins:
    # Every change, before it merges: do the plugins in stave-dsp/stave-plugins
    # still build and lint against it? Not a required check — main may
    # break the plugin API (they pin a release tag) — but a red mark here
    # says the next bump-framework.sh needs plugin work. During a planned
    # break the job builds the stave-plugins branch that follows it, when
    # there is one (scripts/plugins-ref.sh: a `plugins-branch:` line in
    # the pull request or commit, a branch of the same name, or
    # `stave-<next release>`), else stave-plugins' main.
    name: plugins against this change (Linux)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: stave, fetch-depth: 0 }
      - run: rustup toolchain install
        working-directory: stave
      - name: What the change affects
        run: scripts/affected.sh --outputs $AFFECTED_ARGS >> "$GITHUB_ENV"
        working-directory: stave
      # The pull request: this run's, the merge group's (its ref names
      # it), or a push's squashed commit's "(#N)".
      - name: Which stave-plugins branch
        if: env.AFFECTED_SCOPE != 'none'
        working-directory: stave
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message || github.event.merge_group.head_commit.message }}
        run: |
          pr="$PR"
          [[ -z "$pr" && "$GITHUB_REF" =~ /pr-([0-9]+)- ]] && pr="${BASH_REMATCH[1]}"
          [[ -z "$pr" && "$HEAD_MESSAGE" =~ \(#([0-9]+)\) ]] && pr="${BASH_REMATCH[1]}"
          text="$RUNNER_TEMP/change.txt" branch=""
          printf '%s\n' "$HEAD_MESSAGE" > "$text"
          if [[ -n "$pr" ]]; then
            gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json body -q .body >> "$text"
            branch="$(gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json headRefName -q .headRefName)"
          fi
          scripts/plugins-ref.sh --text "$text" --branch "$branch" | tee -a "$GITHUB_ENV"
      - if: env.AFFECTED_SCOPE != 'none'
        uses: actions/checkout@v4
        with: { repository: stave-dsp/stave-plugins, path: stave-plugins, ref: "${{ env.PLUGINS_REF }}" }
      - if: env.AFFECTED_SCOPE != 'none'
        run: rustup toolchain install
        working-directory: stave-plugins
      - if: env.AFFECTED_SCOPE != 'none'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: stave-plugins
          save-if: "${{ github.ref == 'refs/heads/main' }}"
      - if: env.AFFECTED_SCOPE != 'none'
        run: scripts/link-framework.sh ../stave
        working-directory: stave-plugins
      - if: env.AFFECTED_SCOPE != 'none'
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: stave-plugins

  portable:
    # The portable crates never grow platform assumptions: check them on
    # x86_64 Linux, and run their loom models here too.
    name: portable check + loom (Linux)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the base, for scripts/affected.sh
      - run: rustup toolchain install
      - name: What the change affects
        run: scripts/affected.sh --outputs $AFFECTED_ARGS >> "$GITHUB_ENV"
      - if: env.AFFECTED_SCOPE != 'none'
        uses: Swatinem/rust-cache@v2
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - if: env.AFFECTED_SCOPE != 'none'
        run: >-
          cargo check --all-targets --locked
          -p stave-core -p stave-dsp -p stave-telemetry -p stave-measure -p stave-macros
          -p stave-ui -p stave-raster -p stave-face -p stave-clap -p stave-clap-sys
          -p stave-vst3 -p stave-vst3-sys -p stave-model
      - if: env.AFFECTED_SCOPE != 'none'
        run: cargo test -p stave-core -p stave-telemetry --test loom --release --locked
        env:
          RUSTFLAGS: --cfg loom

  miri:
    # The unsafe core and the FULL wrapper path (factory → vtables →
    # in-place process → two instances → release) interpreted under the
    # memory model — this caught the CLAP field-provenance bug. One
    # nextest process per test, sharded so each shard stays under five
    # minutes; safe-code sweeps are `#[cfg_attr(miri, ignore)]`.
    name: miri (${{ matrix.shard }}/4)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the base, for scripts/affected.sh
      - run: rustup toolchain install $NIGHTLY --profile minimal --component miri,rust-src
      # Miri's packages, or a change that reaches the whole workspace.
      - name: What the change affects
        env: { RUSTUP_TOOLCHAIN: "${{ env.NIGHTLY }}" }   # cargo metadata, without the pinned toolchain
        run: |
          out="$(scripts/affected.sh --outputs $AFFECTED_ARGS)"
          echo "$out" >> "$GITHUB_ENV"
          miri=0
          grep -qx 'AFFECTED_SCOPE=workspace' <<<"$out" && miri=1
          for p in $(sed -n 's/^AFFECTED_PACKAGE_NAMES=//p' <<<"$out"); do
            case "$p" in stave-core | stave-telemetry | stave-vst3 | stave-clap) miri=1 ;; esac
          done
          echo "AFFECTED_MIRI=$miri" >> "$GITHUB_ENV"
      - if: env.AFFECTED_MIRI == '1'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: miri
          save-if: "${{ github.ref == 'refs/heads/main' && matrix.shard == 1 }}"
      - if: env.AFFECTED_MIRI == '1'
        uses: taiki-e/install-action@v2.90.3
        with: { tool: nextest@0.9.148 }
      - if: env.AFFECTED_MIRI == '1'
        run: cargo +$NIGHTLY miri setup
      - if: env.AFFECTED_MIRI == '1'
        run: >-
          cargo +$NIGHTLY miri nextest run --locked --profile miri
          --partition hash:${{ matrix.shard }}/4
          -p stave-core -p stave-telemetry -p stave-vst3 -p stave-clap
          -E 'package(stave-core) | package(stave-telemetry) | binary_id(/::(wrapper|table|diagnostics|negotiation|panic|state_race)_abi$/)'
