name: runner-isolation-canary
run-name: isolate ${{ inputs.runner }} ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Replacement runner to verify before production cutover
        required: true
        type: choice
        options:
          - mac-1-isolated
          - reference-isolated
      request_id:
        description: Fleet correlation identifier
        required: true
        type: string
permissions: {}
jobs:
  isolation:
    runs-on: [self-hosted, '${{ format(''fleet-canary-{0}'', inputs.runner) }}']
    steps:
      - name: Verify user and shared toolchain isolation
        env:
          EXPECTED_RUNNER: ${{ inputs.runner }}
        shell: bash
        run: |
          set -euo pipefail
          case "$EXPECTED_RUNNER" in
            mac-1-isolated) expected_user=ci ;;
            reference-isolated) expected_user=reference ;;
            *) exit 1 ;;
          esac
          test "$(id -un)" = "$expected_user"
          test "$RUSTUP_HOME" = /opt/stave-toolchain/rustup
          test "$CARGO_HOME" = "$HOME/.cargo"
          test ! -L "$CARGO_HOME/bin"
          for tool in rustup cargo-nextest clap-validator; do
            path="/opt/stave-toolchain/cargo/bin/$tool"
            test -x "$path"
            test ! -w "$path"
            test "$(stat -f '%Su' "$path")" = root
          done
          rustc +1.96.0 --version | grep '^rustc 1.96.0 '
          rustc +1.86.0 --version | grep '^rustc 1.86.0 '
          cargo +nightly-2026-11-01 miri --version
          cargo nextest --version | grep '^cargo-nextest 0.9.148 '
          clap-validator --version | grep '^clap-validator 0.4.1$'
          xcode-select -p
          cmake --version
          /usr/bin/auval -h
      - name: Compile and run with private caches
        shell: bash
        run: |
          set -euo pipefail
          project=$(mktemp -d "$RUNNER_TEMP/isolation.XXXXXX")
          trap 'rm -rf "$project"' EXIT
          mkdir -p "$project/src"
          printf '[package]\nname="fleet-canary"\nversion="0.0.0"\nedition="2021"\n' > "$project/Cargo.toml"
          printf '#[test]\nfn works() { assert_eq!(2 + 2, 4); }\n' > "$project/src/lib.rs"
          export CARGO_TARGET_DIR="$project/target"
          cargo +1.86.0 test --offline --manifest-path "$project/Cargo.toml"
          cargo +1.96.0 nextest run --offline --manifest-path "$project/Cargo.toml"
