# Linux and Windows (OVERHAUL.md, ledger X): the whole workspace
# builds, lints and tests there; the plugin binaries export each
# platform's entry points, pass clap-validator and Steinberg's
# validator, and stave-host opens them; the face shells are driven in a
# real window (Xvfb on Linux, window messages on Windows). macOS is
# ci.yml's. Every job fits five minutes warm.
#
# A pull request gates what it changes, and only that: `changes` asks
# scripts/affected.sh which packages the change reaches (as ci.yml's
# jobs do), the build, test and lint jobs work on those, and a change
# that reaches no package (documentation, another workflow's file)
# skips them. Not a required check, so a skipped job blocks nothing.
# Main, release branches and a dispatched run gate everything.
name: platforms

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # scripts/affected.sh's base: the pull request's.
  AFFECTED_ARGS: >-
    ${{ github.event_name == 'pull_request' && format('--base origin/{0}', github.base_ref)
    || '--full' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: what the change affects
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.affected.outputs.scope }}
      packages: ${{ steps.affected.outputs.packages }}
      lib-packages: ${{ steps.affected.outputs.lib-packages }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the base, for scripts/affected.sh
      - run: rustup toolchain install
      - id: affected
        run: |
          out="$(scripts/affected.sh --outputs $AFFECTED_ARGS)"
          echo "$out"
          sed -n 's/^AFFECTED_SCOPE=/scope=/p; s/^AFFECTED_PACKAGES=/packages=/p; s/^AFFECTED_LIB_PACKAGES=/lib-packages=/p' <<<"$out" >> "$GITHUB_OUTPUT"

  test:
    # Every target builds (bins, examples, benches); every test runs —
    # the X11 shell's in a real window on Xvfb (STAVE_REQUIRE_DISPLAY
    # makes a missing server a failure, not a skip).
    name: build + test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.scope != 'none'
    runs-on: ${{ matrix.os }}
    env:
      PACKAGES: ${{ needs.changes.outputs.packages }}
      LIB_PACKAGES: ${{ needs.changes.outputs.lib-packages }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libasound2-dev xvfb
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: "${{ github.ref == 'refs/heads/main' }}"
          # A failing test still leaves a warm build for the next run.
          cache-on-failure: true
      - uses: taiki-e/install-action@v2.90.3
        with: { tool: nextest@0.9.148 }
      - run: cargo build --all-targets --locked $PACKAGES
      - name: cargo nextest run
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            export STAVE_REQUIRE_DISPLAY=1
            xvfb-run -a -s "-screen 0 1280x1024x24" cargo nextest run --locked --profile ci --no-tests=pass $PACKAGES
          else
            cargo nextest run --locked --profile ci --no-tests=pass $PACKAGES
          fi
      - if: env.LIB_PACKAGES != ''
        run: cargo test --doc --locked $LIB_PACKAGES
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diff-${{ matrix.os }}
          path: target/golden-diff
          if-no-files-found: ignore

  clippy:
    name: clippy + rustdoc (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.scope != 'none'
    runs-on: ${{ matrix.os }}
    env:
      PACKAGES: ${{ needs.changes.outputs.packages }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libasound2-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: "${{ github.ref == 'refs/heads/main' }}"
          # A failing test still leaves a warm build for the next run.
          cache-on-failure: true
      - run: cargo clippy --all-targets --no-deps --locked $PACKAGES -- -D warnings
      # The standalone (a feature, so the workspace build skips its bin).
      - run: cargo clippy -p stave-tilt-vst3 --features standalone --all-targets --no-deps --locked -- -D warnings
      # Docs of code that only compiles here (the shells, the loaders).
      - run: cargo doc --no-deps --document-private-items --locked $PACKAGES
        env:
          RUSTDOCFLAGS: -D warnings

  validators:
    # The plugin binaries as a DAW meets them: each platform's entry
    # points exported, clap-validator, Steinberg's validator (the SDK is
    # MIT; its build is cached), and stave-host opening the bundle.
    name: validators (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.scope != 'none'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: "${{ github.ref == 'refs/heads/main' }}"
          # A failing test still leaves a warm build for the next run.
          cache-on-failure: true
      - name: Cache the validators
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: |
            vst3sdk/build/bin/Release/validator*
            ~/.cargo/bin/clap-validator*
          key: validators-${{ runner.os }}-vst3sdk-v3.8.1_build_84-clap-validator-0.4.1
      - name: Build the validators
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --locked --git https://github.com/free-audio/clap-validator.git --tag 0.4.1 clap-validator &
          git clone --depth 1 --branch v3.8.1_build_84 --recurse-submodules --shallow-submodules \
            https://github.com/steinbergmedia/vst3sdk.git vst3sdk
          cmake -S vst3sdk -B vst3sdk/build -DCMAKE_BUILD_TYPE=Release \
            -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF \
            -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF \
            -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF
          cmake --build vst3sdk/build --config Release --target validator -j4
          wait
      - run: cargo build --release --locked -p stave-tilt-vst3 -p stave-bench
      - run: scripts/check-exports.sh
      - run: scripts/validate-formats.sh clap
      - run: scripts/validate-formats.sh vst3
        env:
          VALIDATOR: vst3sdk/build/bin/Release/validator
      - name: stave-host opens the bundle
        run: target/release/stave-bench target/validate/StaveTilt.vst3 --validate > /dev/null
