# The documentation site, https://stave-dsp.github.io/stave/: built from
# the code on every push and pull request, deployed from main. Nothing
# it generates is committed — every page is made fresh from the commit
# being built — so a page cannot disagree with the code it ships with.
# scripts/docsite.sh fails on any rustdoc warning (a broken intra-doc
# link in an article included), a guide module without an article, a
# part without a picture, a binary whose --help fails, or a link on any
# page that goes nowhere. The guide's examples are doctests, run with
# the workspace's in ci.yml's test job.
#
# A pull request or a merge group (main's merge queue) builds the site
# only when scripts/affected.sh says the change reaches it (a page's
# source, the guide, a shared file); otherwise the job reports success
# without building, so the required check reports on every change.
name: docs

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # scripts/affected.sh's base: the pull request's, or the merge group's.
  AFFECTED_ARGS: >-
    ${{ github.event_name == 'pull_request' && format('--base origin/{0}', github.base_ref)
    || github.event_name == 'merge_group' && format('--base {0}', github.event.merge_group.base_sha)
    || '--full' }}

jobs:
  build:
    # macOS: rustdoc documents the crates as the platform the API is
    # first written for (the Cocoa face), and the CLI page runs every
    # binary there. The Windows and X11 platform crates are documented
    # for their own targets (scripts/docsite.sh).
    name: build the site
    runs-on: macos-latest
    # Warm (the rust-cache below) this is a few minutes; the first, cold
    # build of the docs target dir takes longer.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changelog is read from the release tags.
          fetch-depth: 0
      - run: rustup toolchain install
      - name: What the change affects
        run: |
          # shellcheck disable=SC2086 # affected.sh emits separate cargo flags
          scripts/affected.sh --outputs $AFFECTED_ARGS >> "$GITHUB_ENV"
      - if: env.AFFECTED_SITE == '1'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Never on persistent self-hosted runners: its cleanBin deletes the
          # tools that were in ~/.cargo/bin before the job (rustup, nextest…).
          cache-bin: "${{ runner.environment == 'github-hosted' }}"
          shared-key: docsite
          save-if: "${{ github.ref == 'refs/heads/main' }}"
      - if: env.AFFECTED_SITE == '1'
        run: scripts/docsite.sh target/site
      - if: env.AFFECTED_SITE == '1'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: target/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    name: deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
