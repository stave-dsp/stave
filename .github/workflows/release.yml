# Ship a plugin: scripts/package.sh on macOS, Windows and Linux — every
# format, the standalone app, the download a stranger installs — and, on
# a published GitHub release, the downloads attached to it. Signing and
# notarisation happen only when their secrets exist; without them the
# job still builds and uploads (ad-hoc signed on macOS, unsigned on
# Windows), and says so. The guide: How-to → Ship your plugin.
#
# Secrets (Settings → Secrets and variables → Actions; none is required):
#   MACOS_CERTIFICATE_P12_BASE64  the Developer ID Application certificate
#                                 and its private key, exported from
#                                 Keychain Access as .p12, then base64
#   MACOS_CERTIFICATE_PASSWORD    the .p12's export password
#   MACOS_SIGN_IDENTITY           the identity's name ("Developer ID
#                                 Application: <Your Name> (<TEAM_ID>)")
#   MACOS_INSTALLER_P12_BASE64    optional: a Developer ID Installer .p12
#   MACOS_INSTALLER_PASSWORD        (for the .pkg), its password,
#   MACOS_INSTALLER_IDENTITY        and its name
#   NOTARY_APPLE_ID, NOTARY_TEAM_ID, NOTARY_PASSWORD
#                                 notarisation with an app-specific password
#   (or NOTARY_API_KEY_P8_BASE64, NOTARY_API_KEY_ID, NOTARY_API_ISSUER
#                                 with an App Store Connect API key)
#   WINDOWS_CERTIFICATE_PFX_BASE64, WINDOWS_CERTIFICATE_PASSWORD
#                                 Authenticode (signtool)
#
# The certificates go into a temporary keychain made for the job (random
# password, deleted at the end, pass or fail); the notary credentials
# become a notarytool profile in that keychain. Nothing is written to the
# repository or the logs.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      crate:
        description: "Plugin crate to package"
        default: stave-tilt-vst3

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CRATE: ${{ inputs.crate || 'stave-tilt-vst3' }}

defaults:
  run:
    shell: bash

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    env:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_INSTALLER_P12_BASE64: ${{ secrets.MACOS_INSTALLER_P12_BASE64 }}
      MACOS_INSTALLER_PASSWORD: ${{ secrets.MACOS_INSTALLER_PASSWORD }}
      MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
      NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
      NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
      NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
      WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libasound2-dev
      - run: rustup toolchain install
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false

      - name: Signing keychain (macOS, when the certificate secret exists)
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_P12_BASE64 != ''
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/stave-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          import() {   # <base64 p12> <p12 password>
            local file="$RUNNER_TEMP/cert.p12"
            printf '%s' "$1" | base64 --decode > "$file"
            security import "$file" -k "$keychain" -P "$2" -f pkcs12 \
              -T /usr/bin/codesign -T /usr/bin/pkgbuild -T /usr/bin/productsign
            rm -f "$file"
          }
          import "$MACOS_CERTIFICATE_P12_BASE64" "$MACOS_CERTIFICATE_PASSWORD"
          [[ -n "$MACOS_INSTALLER_P12_BASE64" ]] && import "$MACOS_INSTALLER_P12_BASE64" "$MACOS_INSTALLER_PASSWORD"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          # First in the search list, so codesign and notarytool find it.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "STAVE_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
          [[ -n "$MACOS_INSTALLER_IDENTITY" ]] && echo "STAVE_INSTALLER_IDENTITY=$MACOS_INSTALLER_IDENTITY" >> "$GITHUB_ENV"
          if [[ -n "$NOTARY_APPLE_ID" ]]; then
            xcrun notarytool store-credentials stave-ci --apple-id "$NOTARY_APPLE_ID" \
              --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --keychain "$keychain"
            echo "STAVE_NOTARY_PROFILE=stave-ci" >> "$GITHUB_ENV"
          elif [[ -n "$NOTARY_API_KEY_P8_BASE64" ]]; then
            key="$RUNNER_TEMP/notary-key.p8"
            printf '%s' "$NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$key"
            xcrun notarytool store-credentials stave-ci --key "$key" --key-id "$NOTARY_API_KEY_ID" \
              --issuer "$NOTARY_API_ISSUER" --keychain "$keychain"
            rm -f "$key"
            echo "STAVE_NOTARY_PROFILE=stave-ci" >> "$GITHUB_ENV"
          fi

      - name: Authenticode certificate and tools (Windows)
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          if [[ -n "$WINDOWS_CERTIFICATE_PFX_BASE64" ]]; then
            printf '%s' "$WINDOWS_CERTIFICATE_PFX_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.pfx"
            echo "STAVE_WIN_SIGN_CERT=$(cygpath -w "$RUNNER_TEMP/cert.pfx")" >> "$GITHUB_ENV"
            echo "STAVE_WIN_SIGN_PASSWORD=$WINDOWS_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
            signtool=$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64 | sort -V | tail -1)
            echo "$signtool" >> "$GITHUB_PATH"
          fi
          inno="/c/Program Files (x86)/Inno Setup 6"
          [[ -x "$inno/ISCC.exe" ]] || choco install innosetup -y --no-progress
          echo "$inno" >> "$GITHUB_PATH"

      - name: Package
        run: scripts/package.sh "$CRATE" all

      - name: Remove the signing keychain and certificates
        if: always()
        run: |
          [[ -f "$RUNNER_TEMP/stave-signing.keychain-db" ]] && security delete-keychain "$RUNNER_TEMP/stave-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/cert.pfx" "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary-key.p8"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CRATE }}-${{ runner.os }}
          path: |
            target/package/${{ env.CRATE }}/*.dmg
            target/package/${{ env.CRATE }}/*.pkg
            target/package/${{ env.CRATE }}/*.zip
            target/package/${{ env.CRATE }}/*-setup.exe
            target/package/${{ env.CRATE }}/*.tar.gz
          if-no-files-found: error

  attach:
    # The downloads on the release that started the run.
    if: github.event_name == 'release'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: downloads, merge-multiple: true }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" downloads/* --clobber --repo "${{ github.repository }}"
