# The newest stable toolchain, weekly: new lints and breakage show up here
# as an issue, never as a red main. Bump rust-toolchain.toml deliberately.
name: canary

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  newest-stable:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy
      - id: check
        continue-on-error: true
        shell: bash   # -eo pipefail: either step failing fails the check
        run: |
          cargo +stable build --workspace --all-targets --locked 2>&1 | tee build.log
          cargo +stable clippy --workspace --all-targets --no-deps --locked -- -D warnings 2>&1 | tee -a build.log
        env:
          RUSTFLAGS: -D warnings
      - if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(rustc +stable --version)
          gh issue create --title "canary: $v breaks the build or adds lints" \
            --body "The weekly canary on \`$v\` failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
