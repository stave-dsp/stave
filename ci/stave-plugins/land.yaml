# Landing stave-dsp/stave-plugins: what its commit must pass on Linux, then
# its main fast-forwarded to it. The `land-stave-plugins` queue of the
# bitdepth-audio project, whose queue files are read from its home
# repository (this one) only: so this file lives here, and its one `source`
# is stave-plugins. An entry's revision is a stave-plugins commit; it is
# what `checkout` fetches and what `land` lands.
#
#   ctrl pipeline ci/stave-plugins/land.yaml --rev <full stave-plugins commit> --without land --follow
#
# The Linux checks of stave-plugins' .github/workflows/: ci.yml's `rules`
# and platforms.yml's ubuntu `test` shards. The three shards together are
# every workspace package (scripts/ci-shard.py asserts it); on one
# instance they are one build, so `test` and `clippy` take the whole
# workspace, in the shards' order (tests, then clippy). The steps run
# stave-plugins' own scripts, ci/tools.sh among them (ALSA, which the
# workflow installs with apt). No Xvfb: no plugin test opens a window (the
# framework's window tests are stave's); one that tried would fail, not
# pass. macOS and Windows (ci.yml `test` and `validators`, the Windows
# shards) are not here.
instances:
  stave-plugins-gate-1:
    kind: container
    image: {image: "ctrl:image/session", channel: stable}
    placement: {machine: "ctrl:machine/pc"}
    resources:
      requests: {cpuMillis: 8000, memoryBytes: 8589934592, diskBytes: 32212254720}
      limits: {cpuMillis: 8000, memoryBytes: 12884901888, diskBytes: 32212254720, processes: 20000}
    priority: batch
    isolation: {idmap: isolated, nesting: false, privileged: false}
steps:
  checkout:
    instance: stave-plugins-gate-1
    run:
      program: {program: command, argv: [git, -C, /src/stave-plugins, log, "-1", --oneline]}
      source: {repository: stave-dsp/stave-plugins, rev: main, path: /src/stave-plugins}
  tools:
    instance: stave-plugins-gate-1
    needs: [checkout]
    run:
      program: {program: command, argv: [bash, ci/tools.sh, install, alsa]}
      workdir: /src/stave-plugins
      env: {CI_TOOLS: /cache/tools}
  # ci.yml `rules`: the tree's own rules.
  framework-pinned:
    instance: stave-plugins-gate-1
    needs: [checkout]
    run:
      program:
        program: command
        argv: [bash, -c, "! grep -q '>>> link-framework' Cargo.toml || { echo 'Cargo.toml has a local link-framework block: run scripts/link-framework.sh --off' >&2; exit 1; }"]
      workdir: /src/stave-plugins
  file-sizes:
    instance: stave-plugins-gate-1
    needs: [checkout]
    run: {program: {program: command, argv: [scripts/check-file-sizes.sh]}, workdir: /src/stave-plugins}
  view-bindings:
    instance: stave-plugins-gate-1
    needs: [checkout]
    run: {program: {program: command, argv: [scripts/check-view-bindings.sh]}, workdir: /src/stave-plugins}
  plugin-rules:
    instance: stave-plugins-gate-1
    needs: [checkout]
    run: {program: {program: command, argv: [scripts/check-plugin-rules.sh]}, workdir: /src/stave-plugins}
  # platforms.yml `test` (ubuntu-latest, shards 1-3): every package's tests, then its clippy.
  test:
    instance: stave-plugins-gate-1
    needs: [tools]
    run:
      program: {program: command, argv: [bash, ci/tools.sh, run, cargo, nextest, run, --workspace, --locked, --profile, ci]}
      workdir: /src/stave-plugins
      env: {CI_TOOLS: /cache/tools, CARGO_TARGET_DIR: /cache/target/stave-plugins}
  clippy:
    instance: stave-plugins-gate-1
    needs: [test]
    run:
      program: {program: command, argv: [bash, ci/tools.sh, run, cargo, clippy, --workspace, --all-targets, --no-deps, --locked, --, -D, warnings]}
      workdir: /src/stave-plugins
      env: {CI_TOOLS: /cache/tools, CARGO_TARGET_DIR: /cache/target/stave-plugins}
  land:
    instance: stave-plugins-gate-1
    needs: [framework-pinned, file-sizes, view-bindings, plugin-rules, clippy]
    run:
      program:
        program: land
        repository: stave-dsp/stave-plugins
        path: /src/stave-plugins
        # Set by --rev.
        commit: "0000000000000000000000000000000000000000"
