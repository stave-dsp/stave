[package]
name = "stave-play"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Windowed plugin host: play a plugin, hear it, watch it"
publish = false

[dependencies]
stave-measure.workspace = true
stave-host.workspace = true
stave-vst3-sys.workspace = true
stave-telemetry.workspace = true
stave-core.workspace = true
stave-dsp.workspace = true
thiserror.workspace = true
cpal = "0.15"
crossbeam-queue = "0.3"
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "wgpu"] }
rfd = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
# Sampled CPU profiling of the audio thread, with flamegraph export.
raw-window-handle = "0.6"

# pprof samples with signals: no Windows.
[target.'cfg(unix)'.dependencies]
pprof = { version = "0.14", default-features = false, features = ["flamegraph"] }

# winit needs a window system on Linux; X11 (loaded at run time, no
# build-time system libraries).
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "wgpu", "x11"] }

[lints]
workspace = true
