[package]
name = "stave-storybook"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The design system's storybook: every part on every theme, live and draggable."
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "stave-storybook"
path = "src/main.rs"

[dependencies]
stave-core.workspace = true
stave-face.workspace = true
stave-raster.workspace = true
stave-ui.workspace = true
stave-font.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
stave-ui-cocoa.workspace = true

[target.'cfg(windows)'.dependencies]
stave-ui-win32.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
stave-ui-x11.workspace = true

[dev-dependencies]
stave-test.workspace = true

[lints]
workspace = true

