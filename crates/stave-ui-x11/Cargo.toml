[package]
name = "stave-ui-x11"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The Linux (X11) platform for a stave face: a child window, the software blit, pointer and keys, on the host's run loop."

[target.'cfg(unix)'.dependencies]
stave-core.workspace = true
stave-face.workspace = true
stave-ui.workspace = true
stave-ui-shell.workspace = true
# The X11 protocol in pure Rust (no libX11/libxcb at build or run time).
x11rb = { version = "0.13", default-features = false }

[target.'cfg(unix)'.dev-dependencies]
stave-font.workspace = true
x11rb = { version = "0.13", default-features = false, features = ["xtest"] }

[lints]
workspace = true

[[test]]
name = "xvfb"
