[package]
name = "stave-dsp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Shared DSP primitives for stave plugins — no_std friendly, no audio-thread allocations"

[lints]
workspace = true

[dev-dependencies]
# Tests measure through the shared metrics (T60, true peak); never a
# runtime dependency.
stave-measure.workspace = true

# The stage harness for instruction counts (scripts/icount.sh) and
# profiles (scripts/profile.sh); `cargo bench` prints a rough ns/sample.
[[bench]]
name = "stages"
harness = false
