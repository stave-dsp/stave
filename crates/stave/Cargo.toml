[package]
name = "stave"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Write an audio plugin: one trait, one macro, VST3 and CLAP"

[dependencies]
stave-core.workspace = true
stave-dsp.workspace = true
stave-face.workspace = true
stave-macros.workspace = true
stave-vst3.workspace = true
stave-clap.workspace = true
stave-standalone = { workspace = true, optional = true }

[features]
# `stave::standalone!`: the plugin as its own app (audio device, MIDI,
# settings). Off for the plugin library itself, so a VST3 or CLAP never
# links the audio device layer; a plugin's `src/main.rs` turns it on.
standalone = ["dep:stave-standalone"]

[lints]
workspace = true
