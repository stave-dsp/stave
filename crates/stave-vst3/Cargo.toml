[package]
name = "stave-vst3"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "VST3 audio plugin backend for the stave framework"

[dependencies]
stave-core.workspace = true
stave-vst3-sys.workspace = true
stave-face.workspace = true

# Faces show in an NSView; elsewhere a plugin has no editor view (yet).
# The face's platform shell.
[target.'cfg(target_os = "macos")'.dependencies]
stave-ui-cocoa.workspace = true
[target.'cfg(windows)'.dependencies]
stave-ui-win32.workspace = true
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
stave-ui-x11.workspace = true

[dev-dependencies]
stave-measure.workspace = true

# The view_window test: a real parent window on each platform.
[target.'cfg(windows)'.dev-dependencies]
stave-ui-win32.workspace = true
[target.'cfg(all(unix, not(target_os = "macos")))'.dev-dependencies]
x11rb = { version = "0.13", default-features = false }

[lints]
workspace = true
