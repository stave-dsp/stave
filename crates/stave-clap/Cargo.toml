[package]
name = "stave-clap"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "CLAP audio plugin backend for the stave framework"

[dependencies]
stave-core.workspace = true
stave-clap-sys.workspace = true
stave-face.workspace = true

# Faces show in an NSView; elsewhere a plugin has no GUI (yet).
# The face's platform shell.
[target.'cfg(target_os = "macos")'.dependencies]
stave-ui-cocoa.workspace = true
[target.'cfg(windows)'.dependencies]
stave-ui-win32.workspace = true
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
stave-ui-x11.workspace = true

