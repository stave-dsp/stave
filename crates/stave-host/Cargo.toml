[package]
name = "stave-host"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Host any VST3 plugin, drive it, and measure it: loading, processing, analysis, the bench and the validation suite"

[dependencies]
thiserror.workspace = true
libc.workspace = true
hound = "3"
stave-measure.workspace = true
stave-model.workspace = true
stave-dsp.workspace = true
stave-vst3-sys.workspace = true
stave-au-sys.workspace = true
stave-telemetry.workspace = true
stave-core.workspace = true
crossbeam-queue = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_no_alloc = "1"
# A real stave plugin, hosted in-process through the full VST3 path.
stave-tilt-vst3 = { path = "../../examples/tilt" }
# An instrument, for the hosts' note paths.
stave-pluck = { path = "../../examples/pluck" }

[lints]
workspace = true
