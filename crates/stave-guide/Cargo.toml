[package]
name = "stave-guide"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The Stave guide: tutorials, concepts and how-tos, every link and example checked by rustdoc"
publish = false

# The articles are Markdown in src/, included as module docs: rustdoc
# resolves their links against every crate below and runs their code as
# doctests. No code of its own uses these, so machete is told.
[dependencies]
stave.workspace = true
stave-core.workspace = true
stave-dsp.workspace = true
stave-face.workspace = true
stave-host.workspace = true
stave-macros.workspace = true
stave-measure.workspace = true
stave-telemetry.workspace = true
stave-test.workspace = true
stave-ui.workspace = true
stave-raster.workspace = true
stave-tilt-vst3 = { path = "../../examples/tilt" }

[package.metadata.cargo-machete]
ignored = ["stave", "stave-core", "stave-dsp", "stave-face", "stave-host", "stave-macros", "stave-measure", "stave-telemetry", "stave-test", "stave-ui", "stave-raster", "stave-tilt-vst3"]

[lints]
workspace = true
