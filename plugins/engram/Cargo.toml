[package]
name = "stave-engram-vst3"
version = "0.0.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Stave Engram — a reverb whose room is a neural network that remembers what you played."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
stave-core.workspace = true
stave-ui.workspace = true
stave-vst3.workspace = true
stave-clap.workspace = true
stave-dsp.workspace = true

[dev-dependencies]
assert_no_alloc = "1"
stave-test = { path = "../../crates/stave-test" }
stave-host = { path = "../../crates/stave-host" }
stave-measure = { path = "../../crates/stave-measure" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
stave-ui-cocoa = { path = "../../crates/stave-ui-cocoa" }

[lints]
workspace = true
