[workspace]
resolver = "2"
members = [
    "crates/stave",
    "crates/stave-clap",
    "crates/stave-clap-sys",
    "crates/stave-core",
    "crates/stave-dsp",
    "crates/stave-face",
    "crates/stave-font",
    "crates/stave-guide",
    "crates/stave-host",
    "crates/stave-macros",
    "crates/stave-measure",
    "crates/stave-model",
    "crates/stave-raster",
    "crates/stave-telemetry",
    "crates/stave-test",
    "crates/stave-ui",
    "crates/stave-ui-cocoa",
    "crates/stave-ui-shell",
    "crates/stave-ui-win32",
    "crates/stave-ui-x11",
    "crates/stave-vst3",
    "crates/stave-vst3-sys",

    "tools/docsite",
    "tools/stave-bench",
    "tools/stave-play",
    "tools/storybook",

    "examples/tilt",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
authors = ["Ryan Bahan <ryan@ryanbahan.com>"]
repository = "https://github.com/stave-dsp/stave"
# 1.81: a panic reaching an `extern "C"` boundary aborts instead of
# being undefined behaviour (the wrappers also catch every one first).
rust-version = "1.86"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)", "cfg(kani)"] }

[workspace.lints.clippy]
ptr_cast_constness = "deny"
# Every `unsafe` block names the invariant that makes it sound; every
# `unsafe fn` states its contract.
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
# DSP loops index several parallel buffers with one counter; zip chains read worse.
needless_range_loop = "allow"

[workspace.dependencies]
libc = "0.2"
stave = { path = "crates/stave" }
stave-ui = { path = "crates/stave-ui" }
stave-ui-cocoa = { path = "crates/stave-ui-cocoa" }
stave-ui-shell = { path = "crates/stave-ui-shell" }
stave-ui-win32 = { path = "crates/stave-ui-win32" }
stave-ui-x11 = { path = "crates/stave-ui-x11" }
stave-raster = { path = "crates/stave-raster" }
stave-face = { path = "crates/stave-face" }
stave-font = { path = "crates/stave-font" }
stave-macros = { path = "crates/stave-macros" }
stave-core = { path = "crates/stave-core" }
stave-clap = { path = "crates/stave-clap" }
stave-vst3 = { path = "crates/stave-vst3" }
stave-vst3-sys = { path = "crates/stave-vst3-sys" }
stave-clap-sys = { path = "crates/stave-clap-sys" }
stave-telemetry = { path = "crates/stave-telemetry" }
stave-dsp = { path = "crates/stave-dsp" }
stave-test = { path = "crates/stave-test" }
stave-host = { path = "crates/stave-host" }
stave-measure = { path = "crates/stave-measure" }
stave-model = { path = "crates/stave-model" }
thiserror = "2"

[profile.release]
lto = "fat"
codegen-units = 1
# Unwind, not abort: the format wrappers catch a plugin panic at the entry
# point (`PanicGuard`) so it silences the instance instead of the DAW.
strip = "symbols"

[profile.dev]
opt-level = 1
# No debuginfo: on macOS ("unpacked") every build otherwise leaves its
# object files in target/debug/deps for the debugger, never collected —
# half a million files made a no-op cargo call take seconds to minutes.
# Panics still name functions; for a debugger session build with
# `--profile debugging`.
debug = false

[profile.debugging]
inherits = "dev"
debug = true
